<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="divWaveWinter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070d1" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#80d8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0070d1" stop-opacity="0.1"/>
    </linearGradient>

    <g id="miniCrystal">
      <circle cx="0" cy="0" r="1.5" class="snow-core" />
      <line x1="-5" y1="0" x2="5" y2="0" class="snow-branch" stroke-width="0.8" />
      <line x1="0" y1="-5" x2="0" y2="5" class="snow-branch" stroke-width="0.8" />
    </g>
  </defs>

  <style>
    /* Light Mode */
    .div-wave-winter { stroke: rgba(2, 132, 199, 0.45); }
    .div-dot-winter { fill: #0284c7; stroke: #0284c7; }
    .snow-core { fill: #0284c7; }
    .snow-branch { stroke: #0284c7; }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      .div-wave-winter { stroke: url(#divWaveWinter); }
      .div-dot-winter { fill: #00f0ff; stroke: #00f0ff; }
      .snow-core { fill: #ffffff; }
      .snow-branch { stroke: #e1f5fe; }
    }

    @keyframes divSnow1 {
      0% { transform: translate(140px, -15px); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(160px, 95px); opacity: 0; }
    }
    @keyframes divSnow2 {
      0% { transform: translate(460px, -15px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translate(440px, 95px); opacity: 0; }
    }
    @keyframes divSnow3 {
      0% { transform: translate(760px, -15px); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(780px, 95px); opacity: 0; }
    }

    .d-snow1 { animation: divSnow1 4.5s linear infinite; }
    .d-snow2 { animation: divSnow2 5.2s linear infinite 1.0s; }
    .d-snow3 { animation: divSnow3 4.8s linear infinite 2.2s; }
  </style>

  <!-- Ambient Wave Line Divider -->
  <path class="div-wave-winter" d="M 20 40 Q 240 18 460 42 T 900 38" stroke-width="2.5" fill="none" />
  <circle class="div-dot-winter" cx="460" cy="42" r="3" />
  <circle class="div-dot-winter" cx="460" cy="42" r="6" stroke-width="1" fill="none" />

  <!-- Drifting Snowflakes Across Divider -->
  <g class="d-snow1"><use href="#miniCrystal"/></g>
  <g class="d-snow2"><use href="#miniCrystal"/></g>
  <g class="d-snow3"><use href="#miniCrystal"/></g>
</svg>
