<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="divWaveWinter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00b4d8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#90e0ef" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0070d1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Mini Dendritic Snowflake -->
    <g id="miniDendriticSnow">
      <defs>
        <g id="miniArm">
          <line x1="0" y1="0" x2="0" y2="-10" stroke-width="1.3" stroke-linecap="round" />
          <line x1="0" y1="-5" x2="-3.5" y2="-8" stroke-width="1.0" stroke-linecap="round" />
          <line x1="0" y1="-5" x2="3.5" y2="-8" stroke-width="1.0" stroke-linecap="round" />
        </g>
      </defs>
      <circle cx="0" cy="0" r="1.5" />
      <use href="#miniArm" />
      <use href="#miniArm" transform="rotate(60)" />
      <use href="#miniArm" transform="rotate(120)" />
      <use href="#miniArm" transform="rotate(180)" />
      <use href="#miniArm" transform="rotate(240)" />
      <use href="#miniArm" transform="rotate(300)" />
    </g>
  </defs>

  <style>
    /* Default / Light Mode */
    .div-wave { stroke: rgba(2, 132, 199, 0.45); }
    .div-center-dot { fill: #0284c7; stroke: #0284c7; }
    .mini-snow { stroke: #0284c7; fill: #0284c7; }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      .div-wave { stroke: url(#divWaveWinter); }
      .div-center-dot { fill: #00f0ff; stroke: #00f0ff; }
      .mini-snow { stroke: #ffffff; fill: #00f0ff; }
    }

    @keyframes divSnowSway1 {
      0% { transform: translate(140px, -15px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(175px, 95px) rotate(160deg); opacity: 0; }
    }
    @keyframes divSnowSway2 {
      0% { transform: translate(450px, -15px) rotate(30deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(425px, 95px) rotate(-140deg); opacity: 0; }
    }
    @keyframes divSnowSway3 {
      0% { transform: translate(750px, -15px) rotate(-20deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(785px, 95px) rotate(180deg); opacity: 0; }
    }

    .d-snow1 { animation: divSnowSway1 5.2s ease-in-out infinite; }
    .d-snow2 { animation: divSnowSway2 5.8s ease-in-out infinite 1.2s; }
    .d-snow3 { animation: divSnowSway3 5.4s ease-in-out infinite 2.2s; }
  </style>

  <!-- Ambient Wave Line Divider -->
  <path class="div-wave" d="M 20 40 Q 240 18 460 42 T 900 38" stroke-width="2.5" fill="none" />
  <circle class="div-center-dot" cx="460" cy="42" r="3" />
  <circle class="div-center-dot" cx="460" cy="42" r="6" stroke-width="1" fill="none" />

  <!-- Falling Dendritic Snowflakes Across Divider -->
  <g class="d-snow1 mini-snow"><use href="#miniDendriticSnow"/></g>
  <g class="d-snow2 mini-snow"><use href="#miniDendriticSnow"/></g>
  <g class="d-snow3 mini-snow"><use href="#miniDendriticSnow"/></g>
</svg>