<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="divWaveSpring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209b7" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#f72585" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ff70a6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.1"/>
    </linearGradient>

    <g id="miniSakura">
      <path d="M 0,-8 C 3,-6 6,-3 5,2 C 4,5 1,8 0,9 C -1,8 -4,5 -5,2 C -6,-3 -3,-6 0,-8 Z" />
    </g>
  </defs>

  <style>
    /* Default / Light Mode */
    .div-wave { stroke: rgba(219, 39, 119, 0.45); }
    .div-center-dot { fill: #db2777; stroke: #db2777; }
    .mini-petal1 { fill: #db2777; }
    .mini-petal2 { fill: #e11d48; }
    .mini-petal3 { fill: #be185d; }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      .div-wave { stroke: url(#divWaveSpring); }
      .div-center-dot { fill: #ff70a6; stroke: #ff70a6; }
      .mini-petal1 { fill: #ffb3c6; }
      .mini-petal2 { fill: #ff70a6; }
      .mini-petal3 { fill: #ffccd5; }
    }

    @keyframes divPetal1 {
      0% { transform: translate(140px, -15px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(240px, 95px) rotate(220deg); opacity: 0; }
    }
    @keyframes divPetal2 {
      0% { transform: translate(450px, -15px) rotate(40deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(520px, 95px) rotate(-190deg); opacity: 0; }
    }
    @keyframes divPetal3 {
      0% { transform: translate(740px, -15px) rotate(-30deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(830px, 95px) rotate(260deg); opacity: 0; }
    }

    .d-pet1 { animation: divPetal1 5.4s ease-in-out infinite; }
    .d-pet2 { animation: divPetal2 6.0s ease-in-out infinite 1.2s; }
    .d-pet3 { animation: divPetal3 5.6s ease-in-out infinite 2.2s; }
  </style>

  <!-- Ambient Wave Line Divider -->
  <path class="div-wave" d="M 20 40 Q 240 18 460 42 T 900 38" stroke-width="2.5" fill="none" />
  <circle class="div-center-dot" cx="460" cy="42" r="3" />
  <circle class="div-center-dot" cx="460" cy="42" r="6" stroke-width="1" fill="none" />

  <!-- Drifting Sakura Petals Across Divider -->
  <g class="d-pet1 mini-petal1"><use href="#miniSakura"/></g>
  <g class="d-pet2 mini-petal2"><use href="#miniSakura"/></g>
  <g class="d-pet3 mini-petal3"><use href="#miniSakura"/></g>
</svg>