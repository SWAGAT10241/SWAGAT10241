<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="divWaveAutumn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#ff9100" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ff5722" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0070d1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Botanical Mini Maple Leaf -->
    <g id="miniBotanicalMaple">
      <path d="M 0,-14 C 2,-11 4,-9 7,-7 C 6,-5 10,-2 11,2 C 8,3 7,6 2,9 C 1,10 0,11 0,11 C 0,11 -1,10 -2,9 C -7,6 -8,3 -11,2 C -10,-2 -6,-5 -7,-7 C -4,-9 -2,-11 0,-14 Z" />
      <path d="M 0,10 L 0,15" stroke="rgba(120,53,15,0.7)" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 0,9 L 0,-10" stroke="rgba(255,255,255,0.6)" stroke-width="0.9" stroke-linecap="round" />
      <path d="M 0,2 Q 4,-2 8,-3" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" fill="none" />
      <path d="M 0,2 Q -4,-2 -8,-3" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" fill="none" />
    </g>
  </defs>

  <style>
    /* Light Mode */
    .div-wave { stroke: rgba(234, 88, 12, 0.45); }
    .div-center-dot { fill: #ea580c; stroke: #ea580c; }
    .leaf-d1 { fill: #c2410c; }
    .leaf-d2 { fill: #d97706; }
    .leaf-d3 { fill: #ea580c; }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      .div-wave { stroke: url(#divWaveAutumn); }
      .div-center-dot { fill: #ff9100; stroke: #ff9100; }
      .leaf-d1 { fill: #ff5722; }
      .leaf-d2 { fill: #ff9800; }
      .leaf-d3 { fill: #ffb300; }
    }

    @keyframes divTumble1 {
      0% { transform: translate(120px, -20px) rotate(10deg) scaleX(1); opacity: 0; }
      25% { opacity: 0.95; transform: translate(165px, 20px) rotate(80deg) scaleX(0.4); }
      65% { opacity: 0.95; transform: translate(140px, 55px) rotate(160deg) scaleX(0.85); }
      100% { transform: translate(185px, 95px) rotate(240deg) scaleX(0.5); opacity: 0; }
    }
    @keyframes divTumble2 {
      0% { transform: translate(450px, -20px) rotate(-20deg) scaleX(0.9); opacity: 0; }
      30% { opacity: 0.95; transform: translate(490px, 25px) rotate(60deg) scaleX(0.35); }
      70% { opacity: 0.95; transform: translate(465px, 60px) rotate(140deg) scaleX(0.9); }
      100% { transform: translate(505px, 95px) rotate(220deg) scaleX(0.45); opacity: 0; }
    }
    @keyframes divTumble3 {
      0% { transform: translate(750px, -20px) rotate(30deg) scaleX(0.95); opacity: 0; }
      25% { opacity: 0.95; transform: translate(785px, 20px) rotate(100deg) scaleX(0.4); }
      65% { opacity: 0.95; transform: translate(760px, 55px) rotate(180deg) scaleX(0.85); }
      100% { transform: translate(800px, 95px) rotate(260deg) scaleX(0.5); opacity: 0; }
    }

    .d-leaf1 { animation: divTumble1 5.5s ease-in-out infinite; }
    .d-leaf2 { animation: divTumble2 6.2s ease-in-out infinite 1.2s; }
    .d-leaf3 { animation: divTumble3 5.8s ease-in-out infinite 2.5s; }
  </style>

  <!-- Ambient Wave Line Divider -->
  <path class="div-wave" d="M 20 40 Q 240 18 460 42 T 900 38" stroke-width="2.5" fill="none" />
  <circle class="div-center-dot" cx="460" cy="42" r="3" />
  <circle class="div-center-dot" cx="460" cy="42" r="6" stroke-width="1" fill="none" />

  <!-- Botanical Tumbling Leaves Across Divider -->
  <g class="d-leaf1 leaf-d1"><use href="#miniBotanicalMaple"/></g>
  <g class="d-leaf2 leaf-d2"><use href="#miniBotanicalMaple"/></g>
  <g class="d-leaf3 leaf-d3"><use href="#miniBotanicalMaple"/></g>
</svg>