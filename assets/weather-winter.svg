<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="waveWinter1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070d1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#80d8ff" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveWinter2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0091ea" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0070d1" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Crystal Snowflake -->
    <g id="crystalFlake">
      <circle cx="0" cy="0" r="2.5" class="snow-core" />
      <line x1="-8" y1="0" x2="8" y2="0" class="snow-branch" stroke-width="1.2" />
      <line x1="0" y1="-8" x2="0" y2="8" class="snow-branch" stroke-width="1.2" />
      <line x1="-6" y1="-6" x2="6" y2="6" class="snow-branch-sub" stroke-width="1" />
      <line x1="-6" y1="6" x2="6" y2="-6" class="snow-branch-sub" stroke-width="1" />
    </g>

    <g id="softFlake">
      <circle cx="0" cy="0" r="3" class="snow-core" />
    </g>
  </defs>

  <style>
    /* Default / Light Mode Styles (Bright Mode Compatible) */
    .hero-title { fill: #0f172a; }
    .hero-subtitle { fill: #0284c7; }
    .season-pill-bg { fill: rgba(0, 112, 209, 0.12); stroke: #0284c7; }
    .season-pill-text { fill: #0369a1; }
    .wave-line-1 { stroke: rgba(2, 132, 199, 0.45); }
    .wave-line-2 { stroke: rgba(0, 112, 209, 0.4); }
    .snow-core { fill: #0284c7; }
    .snow-branch { stroke: #0284c7; }
    .snow-branch-sub { stroke: #38bdf8; }

    /* Dark Mode Overrides */
    @media (prefers-color-scheme: dark) {
      .hero-title { fill: #ffffff; }
      .hero-subtitle { fill: #80d8ff; }
      .season-pill-bg { fill: rgba(0, 112, 209, 0.25); stroke: #00f0ff; }
      .season-pill-text { fill: #e0f7fa; }
      .wave-line-1 { stroke: url(#waveWinter1); }
      .wave-line-2 { stroke: url(#waveWinter2); }
      .snow-core { fill: #ffffff; }
      .snow-branch { stroke: #e1f5fe; }
      .snow-branch-sub { stroke: #b3e5fc; }
    }

    @keyframes waveFloatWinter {
      0% { transform: translateX(0); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0); }
    }

    @keyframes snowDrift1 {
      0% { transform: translate(50px, -20px); opacity: 0; }
      15% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(80px, 240px); opacity: 0; }
    }
    @keyframes snowDrift2 {
      0% { transform: translate(180px, -20px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(140px, 240px); opacity: 0; }
    }
    @keyframes snowDrift3 {
      0% { transform: translate(320px, -20px); opacity: 0; }
      15% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(370px, 240px); opacity: 0; }
    }
    @keyframes snowDrift4 {
      0% { transform: translate(460px, -20px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translate(430px, 240px); opacity: 0; }
    }
    @keyframes snowDrift5 {
      0% { transform: translate(600px, -20px); opacity: 0; }
      15% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(650px, 240px); opacity: 0; }
    }
    @keyframes snowDrift6 {
      0% { transform: translate(720px, -20px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(690px, 240px); opacity: 0; }
    }
    @keyframes snowDrift7 {
      0% { transform: translate(850px, -20px); opacity: 0; }
      15% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(880px, 240px); opacity: 0; }
    }

    .s1 { animation: snowDrift1 5.5s linear infinite; }
    .s2 { animation: snowDrift2 6.8s linear infinite 1.2s; }
    .s3 { animation: snowDrift3 4.8s linear infinite 0.5s; }
    .s4 { animation: snowDrift4 7.2s linear infinite 2.5s; }
    .s5 { animation: snowDrift5 5.2s linear infinite 1.8s; }
    .s6 { animation: snowDrift6 6.2s linear infinite 3.1s; }
    .s7 { animation: snowDrift7 5.8s linear infinite 2.2s; }

    .wave-float-winter { animation: waveFloatWinter 9s ease-in-out infinite; }
  </style>

  <!-- Ambient Wave Ribbons -->
  <g class="wave-float-winter">
    <path class="wave-line-1" d="M -40 150 Q 180 110 460 155 T 960 140" stroke-width="3" fill="none" />
    <path class="wave-line-2" d="M -40 168 Q 220 130 490 170 T 960 155" stroke-width="2.5" fill="none" />
  </g>

  <!-- Animated Snowflakes Across Full Width -->
  <g class="s1"><use href="#crystalFlake"/></g>
  <g class="s2"><use href="#softFlake"/></g>
  <g class="s3"><use href="#crystalFlake"/></g>
  <g class="s4"><use href="#softFlake"/></g>
  <g class="s5"><use href="#crystalFlake"/></g>
  <g class="s6"><use href="#softFlake"/></g>
  <g class="s7"><use href="#crystalFlake"/></g>

  <!-- PlayStation OS Pill Header -->
  <g transform="translate(460, 42)">
    <rect class="season-pill-bg" x="-170" y="-14" width="340" height="28" rx="14" stroke-width="1.2"/>
    <text class="season-pill-text" x="0" y="4.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1.2">
      ❄️ WINTER SEASON // SNOWFALL ACTIVE
    </text>
  </g>

  <!-- Main Hero Titles with Automatic Light/Dark Adaptive Colors -->
  <text class="hero-title" x="460" y="110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="2">
    SWAGAT SOURAV DHAR
  </text>

  <text class="hero-subtitle" x="460" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="1.2">
    IoT Developer · Full-Stack Engineer · TrailGuard / SWAAS · Cyber-Pulse
  </text>
</svg>
