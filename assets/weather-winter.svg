<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Wave Gradients for Dark Mode -->
    <linearGradient id="waveWinter1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0077b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#90e0ef" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveWinter2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03045e" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0096c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#48cae4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Hyper-Realistic 6-Arm Dendritic Crystalline Snowflake -->
    <g id="dendriticSnowflake">
      <defs>
        <g id="crystalArm">
          <line x1="0" y1="0" x2="0" y2="-18" stroke-width="1.5" stroke-linecap="round" />
          <!-- Inner Chevrons -->
          <line x1="0" y1="-7" x2="-4.5" y2="-11.5" stroke-width="1.1" stroke-linecap="round" />
          <line x1="0" y1="-7" x2="4.5" y2="-11.5" stroke-width="1.1" stroke-linecap="round" />
          <!-- Outer Chevrons -->
          <line x1="0" y1="-12" x2="-5" y2="-16.5" stroke-width="1.0" stroke-linecap="round" />
          <line x1="0" y1="-12" x2="5" y2="-16.5" stroke-width="1.0" stroke-linecap="round" />
          <!-- Crystal Tip -->
          <circle cx="0" cy="-18" r="1.1" />
        </g>
      </defs>
      <!-- Central Hexagon Facet -->
      <polygon points="0,-3.5 3,-1.75 3,1.75 0,3.5 -3,1.75 -3,-1.75" />
      <g class="snow-branch">
        <use href="#crystalArm" />
        <use href="#crystalArm" transform="rotate(60)" />
        <use href="#crystalArm" transform="rotate(120)" />
        <use href="#crystalArm" transform="rotate(180)" />
        <use href="#crystalArm" transform="rotate(240)" />
        <use href="#crystalArm" transform="rotate(300)" />
      </g>
    </g>

    <!-- Star Flake -->
    <g id="stellarFlake">
      <polygon class="snow-core" points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" />
      <circle cx="0" cy="0" r="1.8" fill="#ffffff" />
    </g>
  </defs>

  <style>
    /* Default / Light Mode Styles (Bright Mode High-Contrast) */
    .hero-title { fill: #0f172a; }
    .hero-subtitle { fill: #0284c7; }
    .season-pill-bg { fill: rgba(2, 132, 199, 0.12); stroke: #0284c7; }
    .season-pill-text { fill: #0369a1; }
    .wave-line-1 { stroke: rgba(2, 132, 199, 0.45); }
    .wave-line-2 { stroke: rgba(14, 165, 233, 0.35); }
    .snow-branch { stroke: #0284c7; fill: #0284c7; }
    .snow-core { fill: #0284c7; }

    /* Dark Mode Overrides (Automatic when viewer has dark theme) */
    @media (prefers-color-scheme: dark) {
      .hero-title { fill: #ffffff; }
      .hero-subtitle { fill: #b3e5fc; }
      .season-pill-bg { fill: rgba(0, 180, 216, 0.22); stroke: #00f0ff; }
      .season-pill-text { fill: #e1f5fe; }
      .wave-line-1 { stroke: url(#waveWinter1); }
      .wave-line-2 { stroke: url(#waveWinter2); }
      .snow-branch { stroke: #ffffff; fill: #ffffff; }
      .snow-core { fill: #00f0ff; }
    }

    @keyframes waveFloatWinter {
      0% { transform: translateX(0); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0); }
    }

    /* Natural Snowflake Sway and Flutter */
    @keyframes snowSway1 {
      0% { transform: translate(60px, -30px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(130px, 250px) rotate(180deg); opacity: 0; }
    }
    @keyframes snowSway2 {
      0% { transform: translate(220px, -30px) rotate(40deg); opacity: 0; }
      20% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(170px, 250px) rotate(-140deg); opacity: 0; }
    }
    @keyframes snowSway3 {
      0% { transform: translate(440px, -30px) rotate(-20deg); opacity: 0; }
      20% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(490px, 250px) rotate(160deg); opacity: 0; }
    }
    @keyframes snowSway4 {
      0% { transform: translate(650px, -30px) rotate(30deg); opacity: 0; }
      20% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(600px, 250px) rotate(-150deg); opacity: 0; }
    }
    @keyframes snowSway5 {
      0% { transform: translate(820px, -30px) rotate(-35deg); opacity: 0; }
      20% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(870px, 250px) rotate(145deg); opacity: 0; }
    }

    .sf1 { animation: snowSway1 6.5s ease-in-out infinite; }
    .sf2 { animation: snowSway2 7.2s ease-in-out infinite 1.2s; }
    .sf3 { animation: snowSway3 6.0s ease-in-out infinite 2.0s; }
    .sf4 { animation: snowSway4 7.6s ease-in-out infinite 0.6s; }
    .sf5 { animation: snowSway5 6.8s ease-in-out infinite 1.6s; }

    .wave-float-winter { animation: waveFloatWinter 9s ease-in-out infinite; }
  </style>

  <!-- Ambient Wave Ribbons (Borderless, Transparent) -->
  <g class="wave-float-winter">
    <path class="wave-line-1" d="M -40 150 Q 180 110 460 155 T 960 140" stroke-width="3" fill="none" />
    <path class="wave-line-2" d="M -40 168 Q 220 130 490 170 T 960 155" stroke-width="2.5" fill="none" />
  </g>

  <!-- Hyper-Realistic Dendritic Snowflakes Falling Across Full Width -->
  <g class="sf1"><use href="#dendriticSnowflake"/></g>
  <g class="sf2"><use href="#stellarFlake"/></g>
  <g class="sf3"><use href="#dendriticSnowflake"/></g>
  <g class="sf4"><use href="#stellarFlake"/></g>
  <g class="sf5"><use href="#dendriticSnowflake"/></g>

  <!-- Season Status Tag Pill -->
  <g transform="translate(460, 42)">
    <rect class="season-pill-bg" x="-160" y="-14" width="320" height="28" rx="14" stroke-width="1.2"/>
    <text class="season-pill-text" x="0" y="4.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1.2">
      ❄️ WINTER FROST // DENDRITIC SNOW ACTIVE
    </text>
  </g>

  <!-- Main Hero Titles -->
  <text class="hero-title" x="460" y="110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="2">
    SWAGAT SOURAV DHAR
  </text>

  <text class="hero-subtitle" x="460" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="1.2">
    IoT Developer · Full-Stack Engineer · TrailGuard / SWAAS · Cyber-Pulse
  </text>
</svg>