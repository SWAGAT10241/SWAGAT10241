<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradWinter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000a18"/>
      <stop offset="50%" stop-color="#021430"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>

    <linearGradient id="waveGradWinter1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070d1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#80d8ff" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveGradWinter2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0091ea" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00b0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Crystal Snowflake Definition -->
    <g id="crystalFlake">
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#e1f5fe" stroke-width="1.2" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#e1f5fe" stroke-width="1.2" />
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#b3e5fc" stroke-width="1" />
      <line x1="-6" y1="6" x2="6" y2="-6" stroke="#b3e5fc" stroke-width="1" />
    </g>

    <!-- Soft Snow Dot Definition -->
    <g id="softFlake">
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <filter id="glowWinter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveFlowWinter {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }

    @keyframes snowFall1 {
      0% { transform: translate(50px, -20px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(80px, 260px); opacity: 0; }
    }

    @keyframes snowFall2 {
      0% { transform: translate(180px, -20px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translate(140px, 260px); opacity: 0; }
    }

    @keyframes snowFall3 {
      0% { transform: translate(320px, -20px); opacity: 0; }
      15% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translate(370px, 260px); opacity: 0; }
    }

    @keyframes snowFall4 {
      0% { transform: translate(460px, -20px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translate(430px, 260px); opacity: 0; }
    }

    @keyframes snowFall5 {
      0% { transform: translate(600px, -20px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(650px, 260px); opacity: 0; }
    }

    @keyframes snowFall6 {
      0% { transform: translate(720px, -20px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translate(690px, 260px); opacity: 0; }
    }

    @keyframes snowFall7 {
      0% { transform: translate(850px, -20px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(880px, 260px); opacity: 0; }
    }

    @keyframes snowFall8 {
      0% { transform: translate(250px, -20px); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.75; }
      100% { transform: translate(280px, 260px); opacity: 0; }
    }

    .snow1 { animation: snowFall1 5.5s linear infinite; }
    .snow2 { animation: snowFall2 6.8s linear infinite 1.2s; }
    .snow3 { animation: snowFall3 4.8s linear infinite 0.5s; }
    .snow4 { animation: snowFall4 7.2s linear infinite 2.5s; }
    .snow5 { animation: snowFall5 5.2s linear infinite 1.8s; }
    .snow6 { animation: snowFall6 6.2s linear infinite 3.1s; }
    .snow7 { animation: snowFall7 5.8s linear infinite 2.2s; }
    .snow8 { animation: snowFall8 7.5s linear infinite 4.0s; }

    .wave-anim-winter { animation: waveFlowWinter 8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="240" rx="14" fill="url(#bgGradWinter)" />
  <rect width="920" height="240" rx="14" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />

  <!-- Ambient Glacial Waves -->
  <g class="wave-anim-winter">
    <path d="M -50 170 Q 180 130 460 175 T 970 160 L 970 240 L -50 240 Z" fill="url(#waveGradWinter1)" />
    <path d="M -50 185 Q 220 150 490 190 T 970 175 L 970 240 L -50 240 Z" fill="url(#waveGradWinter2)" />
  </g>

  <!-- Animated Falling Snowflakes -->
  <g class="snow1"><use href="#crystalFlake"/></g>
  <g class="snow2"><use href="#softFlake"/></g>
  <g class="snow3"><use href="#crystalFlake"/></g>
  <g class="snow4"><use href="#softFlake"/></g>
  <g class="snow5"><use href="#crystalFlake"/></g>
  <g class="snow6"><use href="#softFlake"/></g>
  <g class="snow7"><use href="#crystalFlake"/></g>
  <g class="snow8"><use href="#softFlake"/></g>

  <!-- Top PlayStation OS Brand Mark -->
  <rect x="36" y="24" width="30" height="30" rx="6" fill="#0070d1" filter="url(#glowWinter)"/>
  <text x="51" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">PS</text>

  <!-- Title & Description Header -->
  <text x="76" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#00f0ff" letter-spacing="1.5">
    CYBER-PULSE OS // WINTER SEASON ACTIVE
  </text>

  <g transform="translate(884, 38)">
    <circle cx="-12" cy="0" r="4" fill="#00ff7f"/>
    <text x="-24" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#8bb2e8" text-anchor="end">ONLINE</text>
  </g>

  <!-- Main Hero Titles -->
  <text x="460" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    SWAGAT SOURAV DHAR
  </text>

  <text x="460" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#80d8ff" text-anchor="middle" letter-spacing="1">
    IoT Developer · Full-Stack Engineer · TrailGuard / SWAAS · Cyber-Pulse
  </text>

  <!-- Season Status Tag Pill -->
  <g transform="translate(460, 184)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(0, 112, 209, 0.3)" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#e0f7fa" text-anchor="middle" letter-spacing="0.8">
      ❄️ WINTER FROST (SNOW FALL) ACTIVE
    </text>
  </g>
</svg>
