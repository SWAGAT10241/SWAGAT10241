<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="divWaveRain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00b4d8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#48cae4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.1"/>
    </linearGradient>

    <g id="miniRain">
      <line class="mini-rain-streak" x1="0" y1="0" x2="-3" y2="20" stroke-width="1.6" stroke-linecap="round" />
    </g>
  </defs>

  <style>
    /* Default / Light Mode */
    .div-wave { stroke: rgba(2, 132, 199, 0.45); }
    .div-center-dot { fill: #0284c7; stroke: #0284c7; }
    .mini-rain-streak { stroke: #0284c7; }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      .div-wave { stroke: url(#divWaveRain); }
      .div-center-dot { fill: #00b4d8; stroke: #00b4d8; }
      .mini-rain-streak { stroke: #00f0ff; }
    }

    @keyframes divRain1 {
      0% { transform: translate(180px, -20px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translate(160px, 95px); opacity: 0; }
    }
    @keyframes divRain2 {
      0% { transform: translate(480px, -20px); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(460px, 95px); opacity: 0; }
    }
    @keyframes divRain3 {
      0% { transform: translate(780px, -20px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translate(760px, 95px); opacity: 0; }
    }

    .d-rain1 { animation: divRain1 1.4s linear infinite; }
    .d-rain2 { animation: divRain2 1.6s linear infinite 0.5s; }
    .d-rain3 { animation: divRain3 1.5s linear infinite 0.9s; }
  </style>

  <!-- Ambient Wave Line Divider -->
  <path class="div-wave" d="M 20 40 Q 240 18 460 42 T 900 38" stroke-width="2.5" fill="none" />
  <circle class="div-center-dot" cx="460" cy="42" r="3" />
  <circle class="div-center-dot" cx="460" cy="42" r="6" stroke-width="1" fill="none" />

  <!-- Falling Raindrops Across Divider -->
  <g class="d-rain1"><use href="#miniRain"/></g>
  <g class="d-rain2"><use href="#miniRain"/></g>
  <g class="d-rain3"><use href="#miniRain"/></g>
</svg>