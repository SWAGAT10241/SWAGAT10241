<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Wave Gradients for Dark Mode -->
    <linearGradient id="waveGradSpring1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#b5179e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff70a6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveGradSpring2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209b7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ff4d6d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb3c6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Sakura Petal Definition -->
    <g id="sakuraPetal">
      <path d="M 0,-12 C 4,-10 9,-4 8,4 C 7,8 2,12 0,14 C -2,12 -7,8 -8,4 C -9,-4 -4,-10 0,-12 Z" />
    </g>
  </defs>

  <style>
    /* Default / Light Mode Styles (Bright Mode Compatible) */
    .hero-title { fill: #0f172a; }
    .hero-subtitle { fill: #db2777; }
    .season-pill-bg { fill: rgba(244, 114, 182, 0.12); stroke: #db2777; }
    .season-pill-text { fill: #be185d; }
    .wave-line-1 { stroke: rgba(219, 39, 119, 0.45); }
    .wave-line-2 { stroke: rgba(190, 24, 93, 0.35); }
    .petal-c1 { fill: #db2777; }
    .petal-c2 { fill: #e11d48; }
    .petal-c3 { fill: #be185d; }
    .petal-c4 { fill: #f43f5e; }
    .petal-c5 { fill: #e11d48; }

    /* Dark Mode Overrides (Automatic when viewer has dark theme) */
    @media (prefers-color-scheme: dark) {
      .hero-title { fill: #ffffff; }
      .hero-subtitle { fill: #ffcad4; }
      .season-pill-bg { fill: rgba(247, 37, 133, 0.25); stroke: #ff70a6; }
      .season-pill-text { fill: #ffe5ec; }
      .wave-line-1 { stroke: url(#waveGradSpring1); }
      .wave-line-2 { stroke: url(#waveGradSpring2); }
      .petal-c1 { fill: #ffb3c6; }
      .petal-c2 { fill: #ff70a6; }
      .petal-c3 { fill: #ffccd5; }
      .petal-c4 { fill: #ff4d6d; }
      .petal-c5 { fill: #ffaec9; }
    }

    @keyframes waveFlowSpring {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }

    @keyframes sakuraFall1 {
      0% { transform: translate(70px, -20px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(180px, 240px) rotate(320deg); opacity: 0; }
    }

    @keyframes sakuraFall2 {
      0% { transform: translate(240px, -20px) rotate(45deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translate(320px, 240px) rotate(270deg); opacity: 0; }
    }

    @keyframes sakuraFall3 {
      0% { transform: translate(430px, -20px) rotate(-30deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(510px, 240px) rotate(360deg); opacity: 0; }
    }

    @keyframes sakuraFall4 {
      0% { transform: translate(620px, -20px) rotate(20deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translate(710px, 240px) rotate(290deg); opacity: 0; }
    }

    @keyframes sakuraFall5 {
      0% { transform: translate(800px, -20px) rotate(-40deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(890px, 240px) rotate(340deg); opacity: 0; }
    }

    .petal1 { animation: sakuraFall1 6.5s ease-in-out infinite; }
    .petal2 { animation: sakuraFall2 7.2s ease-in-out infinite 1.2s; }
    .petal3 { animation: sakuraFall3 6.0s ease-in-out infinite 0.7s; }
    .petal4 { animation: sakuraFall4 7.8s ease-in-out infinite 2.0s; }
    .petal5 { animation: sakuraFall5 6.8s ease-in-out infinite 1.5s; }

    .wave-anim-spring { animation: waveFlowSpring 8s ease-in-out infinite; }
  </style>

  <!-- Ambient Wave Ribbons (Borderless, Transparent) -->
  <g class="wave-anim-spring">
    <path class="wave-line-1" d="M -50 150 Q 180 110 460 155 T 970 140" stroke-width="3" fill="none" />
    <path class="wave-line-2" d="M -50 168 Q 220 130 490 170 T 970 155" stroke-width="2.5" fill="none" />
  </g>

  <!-- Animated Falling Sakura Petals -->
  <g class="petal1 petal-c1"><use href="#sakuraPetal"/></g>
  <g class="petal2 petal-c2"><use href="#sakuraPetal"/></g>
  <g class="petal3 petal-c3"><use href="#sakuraPetal"/></g>
  <g class="petal4 petal-c4"><use href="#sakuraPetal"/></g>
  <g class="petal5 petal-c5"><use href="#sakuraPetal"/></g>

  <!-- Season Status Tag Pill -->
  <g transform="translate(460, 42)">
    <rect class="season-pill-bg" x="-160" y="-14" width="320" height="28" rx="14" stroke-width="1.2"/>
    <text class="season-pill-text" x="0" y="4.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1.2">
      🌸 SPRING SAKURA // PETAL BLOOM ACTIVE
    </text>
  </g>

  <!-- Main Hero Titles -->
  <text class="hero-title" x="460" y="110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="2">
    SWAGAT SOURAV DHAR
  </text>

  <text class="hero-subtitle" x="460" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="1.2">
    IoT Developer · Full-Stack Engineer · TrailGuard / SWAAS · Cyber-Pulse
  </text>
</svg>