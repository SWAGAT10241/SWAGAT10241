<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Wave Gradients for Dark Mode -->
    <linearGradient id="waveSummer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e00" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffb703" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveSummer2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070d1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fb8500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Firefly / Solar Spark Definition -->
    <g id="solarFirefly">
      <circle class="firefly-glow" cx="0" cy="0" r="7" />
      <circle class="firefly-core" cx="0" cy="0" r="2.8" />
      <line x1="-5" y1="0" x2="5" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
      <line x1="0" y1="-5" x2="0" y2="5" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
    </g>
  </defs>

  <style>
    /* Default / Light Mode Styles (Bright Mode Compatible) */
    .hero-title { fill: #0f172a; }
    .hero-subtitle { fill: #d97706; }
    .season-pill-bg { fill: rgba(245, 158, 11, 0.12); stroke: #d97706; }
    .season-pill-text { fill: #b45309; }
    .wave-line-1 { stroke: rgba(245, 158, 11, 0.45); }
    .wave-line-2 { stroke: rgba(217, 119, 6, 0.35); }
    .firefly-core { fill: #d97706; }
    .firefly-glow { fill: rgba(245, 158, 11, 0.3); }

    /* Dark Mode Overrides (Automatic when viewer has dark theme) */
    @media (prefers-color-scheme: dark) {
      .hero-title { fill: #ffffff; }
      .hero-subtitle { fill: #fde047; }
      .season-pill-bg { fill: rgba(234, 179, 8, 0.22); stroke: #facc15; }
      .season-pill-text { fill: #fef08a; }
      .wave-line-1 { stroke: url(#waveSummer1); }
      .wave-line-2 { stroke: url(#waveSummer2); }
      .firefly-core { fill: #ffffff; }
      .firefly-glow { fill: rgba(250, 204, 21, 0.55); }
    }

    @keyframes waveFloatSummer {
      0% { transform: translateX(0); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0); }
    }

    @keyframes fireflyDrift1 {
      0% { transform: translate(80px, 190px) scale(0.6); opacity: 0; }
      30% { opacity: 0.95; transform: translate(110px, 110px) scale(1.1); }
      70% { opacity: 0.95; transform: translate(90px, 50px) scale(0.9); }
      100% { transform: translate(130px, -20px) scale(0.5); opacity: 0; }
    }
    @keyframes fireflyDrift2 {
      0% { transform: translate(240px, 200px) scale(0.7); opacity: 0; }
      25% { opacity: 0.9; transform: translate(210px, 130px) scale(1.2); }
      75% { opacity: 0.9; transform: translate(250px, 60px) scale(1.0); }
      100% { transform: translate(220px, -20px) scale(0.6); opacity: 0; }
    }
    @keyframes fireflyDrift3 {
      0% { transform: translate(420px, 195px) scale(0.5); opacity: 0; }
      30% { opacity: 1; transform: translate(450px, 120px) scale(1.3); }
      70% { opacity: 1; transform: translate(410px, 45px) scale(0.85); }
      100% { transform: translate(440px, -20px) scale(0.5); opacity: 0; }
    }
    @keyframes fireflyDrift4 {
      0% { transform: translate(600px, 205px) scale(0.6); opacity: 0; }
      35% { opacity: 0.9; transform: translate(570px, 115px) scale(1.1); }
      70% { opacity: 0.9; transform: translate(620px, 55px) scale(1.0); }
      100% { transform: translate(590px, -20px) scale(0.6); opacity: 0; }
    }
    @keyframes fireflyDrift5 {
      0% { transform: translate(780px, 190px) scale(0.7); opacity: 0; }
      30% { opacity: 0.95; transform: translate(810px, 125px) scale(1.2); }
      75% { opacity: 0.95; transform: translate(770px, 50px) scale(0.9); }
      100% { transform: translate(820px, -20px) scale(0.5); opacity: 0; }
    }

    .ff1 { animation: fireflyDrift1 5.8s ease-in-out infinite; }
    .ff2 { animation: fireflyDrift2 6.5s ease-in-out infinite 1.2s; }
    .ff3 { animation: fireflyDrift3 5.2s ease-in-out infinite 0.6s; }
    .ff4 { animation: fireflyDrift4 6.8s ease-in-out infinite 1.8s; }
    .ff5 { animation: fireflyDrift5 6.0s ease-in-out infinite 0.9s; }

    .wave-float-summer { animation: waveFloatSummer 8.5s ease-in-out infinite; }
  </style>

  <!-- Ambient Wave Ribbons (Borderless, Transparent) -->
  <g class="wave-float-summer">
    <path class="wave-line-1" d="M -40 150 Q 180 110 460 155 T 960 140" stroke-width="3" fill="none" />
    <path class="wave-line-2" d="M -40 168 Q 220 130 490 170 T 960 155" stroke-width="2.5" fill="none" />
  </g>

  <!-- Animated Rising Solar Fireflies Across Full Width -->
  <g class="ff1"><use href="#solarFirefly"/></g>
  <g class="ff2"><use href="#solarFirefly"/></g>
  <g class="ff3"><use href="#solarFirefly"/></g>
  <g class="ff4"><use href="#solarFirefly"/></g>
  <g class="ff5"><use href="#solarFirefly"/></g>

  <!-- Season Status Tag Pill -->
  <g transform="translate(460, 42)">
    <rect class="season-pill-bg" x="-175" y="-14" width="350" height="28" rx="14" stroke-width="1.2"/>
    <text class="season-pill-text" x="0" y="4.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1.2">
      ☀️ SUMMER SOLSTICE // SOLAR FIREFLIES ACTIVE
    </text>
  </g>

  <!-- Main Hero Titles -->
  <text class="hero-title" x="460" y="110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="2">
    SWAGAT SOURAV DHAR
  </text>

  <text class="hero-subtitle" x="460" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="1.2">
    IoT Developer · Full-Stack Engineer · TrailGuard / SWAAS · Cyber-Pulse
  </text>
</svg>