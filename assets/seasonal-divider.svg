<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="divWaveAutumn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#ff9100" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ff5722" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0070d1" stop-opacity="0.1"/>
    </linearGradient>

    <g id="miniLeaf">
      <path d="M 0,-10 C 3,-6 7,-5 9,0 C 6,3 3,6 0,9 C -3,6 -6,3 -9,0 C -7,-5 -3,-6 0,-10 Z" />
      <line x1="0" y1="-8" x2="0" y2="10" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
    </g>
  </defs>

  <style>
    @keyframes divDrift1 {
      0% { transform: translate(120px, -15px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translate(220px, 95px) rotate(220deg); opacity: 0; }
    }
    @keyframes divDrift2 {
      0% { transform: translate(450px, -15px) rotate(40deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(520px, 95px) rotate(-190deg); opacity: 0; }
    }
    @keyframes divDrift3 {
      0% { transform: translate(750px, -15px) rotate(-30deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translate(840px, 95px) rotate(260deg); opacity: 0; }
    }

    .d-leaf1 { animation: divDrift1 5.5s ease-in-out infinite; }
    .d-leaf2 { animation: divDrift2 6.2s ease-in-out infinite 1.2s; }
    .d-leaf3 { animation: divDrift3 5.8s ease-in-out infinite 2.5s; }
  </style>

  <!-- Ambient Wave Line Divider -->
  <path d="M 20 40 Q 240 18 460 42 T 900 38" stroke="url(#divWaveAutumn)" stroke-width="2.5" fill="none" />
  <circle cx="460" cy="42" r="3" fill="#ff9100" />
  <circle cx="460" cy="42" r="6" stroke="#ff9100" stroke-width="1" fill="none" />

  <!-- Drifting Leaves Across Divider -->
  <g class="d-leaf1" fill="#d84315"><use href="#miniLeaf"/></g>
  <g class="d-leaf2" fill="#ff8f00"><use href="#miniLeaf"/></g>
  <g class="d-leaf3" fill="#ef6c00"><use href="#miniLeaf"/></g>
</svg>
