<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@swagat10241/seasonal-particles — Interactive Demo Playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      background: #090d16;
      color: #f1f5f9;
      transition: background 0.4s ease;
      user-select: none;
    }
    body.light {
      background: #f8fafc;
      color: #0f172a;
    }
    canvas#stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }
    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      max-width: 360px;
      transition: all 0.3s ease;
    }
    body.light .hud {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(15, 23, 42, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      color: #0f172a;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.68rem;
      background: #3b82f6;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    p.desc {
      font-size: 0.8rem;
      opacity: 0.75;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .control-group {
      margin-bottom: 14px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      opacity: 0.85;
    }
    select, input[type="range"] {
      width: 100%;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    select {
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      outline: none;
      cursor: pointer;
    }
    body.light select {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.15);
    }
    select option {
      background: #0f172a;
      color: #fff;
    }
    body.light select option {
      background: #ffffff;
      color: #0f172a;
    }
    .theme-toggle-btn {
      width: 100%;
      padding: 9px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease;
    }
    body.light .theme-toggle-btn {
      border-color: rgba(0, 0, 0, 0.15);
      background: rgba(0, 0, 0, 0.04);
    }
    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    body.light .theme-toggle-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .stats-bar {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-family: monospace;
      opacity: 0.85;
    }
    body.light .stats-bar {
      border-top-color: rgba(0, 0, 0, 0.1);
    }
    .hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      opacity: 0.85;
      pointer-events: none;
    }
    body.light .hint {
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      border-color: rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="hud">
    <h1>
      <span>Seasonal Particles</span>
      <span class="badge">v1.0.0</span>
    </h1>
    <p class="desc">60 FPS zero-dependency canvas engine with 3D aerodynamics & shockwaves.</p>

    <div class="control-group">
      <label for="season-select">Season (Shada Ritu)</label>
      <select id="season-select">
        <option value="auto">Auto (Current Date Preset)</option>
        <option value="shishira">Shishira (Deep Winter / Snowflakes)</option>
        <option value="vasanta">Vasanta (Spring / Sakura Petals)</option>
        <option value="grishma">Grishma (Summer / Golden Embers)</option>
        <option value="varsha">Varsha (Monsoon / Rain & Ripples)</option>
        <option value="sharad">Sharad (Autumn / Maple Leaves)</option>
        <option value="hemanta" selected>Hemanta (Pre-Winter / Oak & Frost)</option>
      </select>
    </div>

    <div class="control-group">
      <label>
        <span>Particle Count</span>
        <span id="count-val">75</span>
      </label>
      <input type="range" id="count-slider" min="15" max="250" value="75">
    </div>

    <div class="control-group">
      <label>
        <span>Wind Velocity</span>
        <span id="wind-val">0.4</span>
      </label>
      <input type="range" id="wind-slider" min="-3" max="3" step="0.2" value="0.4">
    </div>

    <button id="theme-btn" class="theme-toggle-btn">
      <span id="theme-icon">☀️</span> Switch to Brighter Light Mode
    </button>

    <div class="stats-bar">
      <span>FPS: <strong id="fps-counter">60</strong></span>
      <span>Engine: <strong>Zero-Dep</strong></span>
      <span>Heap: <strong>&lt; 2 MB</strong></span>
    </div>
  </div>

  <div class="hint">
    💡 Move cursor to repulse particles • Click anywhere to fire radial shockwave
  </div>

  <script type="module">
    import { createSeasonalParticles } from '../src/index.js';

    const canvas = document.getElementById('stage');
    let currentTheme = 'dark';

    const engine = createSeasonalParticles(canvas, {
      season: 'hemanta',
      theme: currentTheme,
      particleCount: 75,
      interactive: true,
      wind: 0.4
    });

    // FPS Meter
    let lastTime = performance.now();
    let frameCount = 0;
    const fpsEl = document.getElementById('fps-counter');

    function calculateFps(now) {
      frameCount++;
      if (now - lastTime >= 1000) {
        fpsEl.textContent = Math.round((frameCount * 1000) / (now - lastTime));
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(calculateFps);
    }
    requestAnimationFrame(calculateFps);

    // Controls
    const seasonSelect = document.getElementById('season-select');
    seasonSelect.addEventListener('change', (e) => {
      engine.setSeason(e.target.value);
    });

    const countSlider = document.getElementById('count-slider');
    const countVal = document.getElementById('count-val');
    countSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      countVal.textContent = val;
      engine.options.particleCount = val;
      engine.initParticles();
    });

    const windSlider = document.getElementById('wind-slider');
    const windVal = document.getElementById('wind-val');
    windSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      windVal.textContent = val.toFixed(1);
      engine.setWind({ x: val });
    });

    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    themeBtn.addEventListener('click', () => {
      if (currentTheme === 'dark') {
        currentTheme = 'light';
        document.body.classList.add('light');
        themeIcon.textContent = '🌙';
        themeBtn.childNodes[2].textContent = ' Switch to Dark Mode';
      } else {
        currentTheme = 'dark';
        document.body.classList.remove('light');
        themeIcon.textContent = '☀️';
        themeBtn.childNodes[2].textContent = ' Switch to Brighter Light Mode';
      }
      engine.setTheme(currentTheme);
    });
  </script>
</body>
</html>
