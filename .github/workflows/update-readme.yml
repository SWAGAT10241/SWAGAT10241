name: Auto Update Profile README

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update timestamp marker
        run: |
          TODAY=$(date '+%d %B %Y')
          if grep -q '<!-- LAST_UPDATED -->' README.md; then
            sed -i -E "s/(<!-- LAST_UPDATED -->).*?(<!-- \/LAST_UPDATED -->)/\1Last updated on ${TODAY}\2/" README.md
          else
            echo "No LAST_UPDATED marker in README — skip."
          fi

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore(profile): auto-update daily timestamp [skip ci]"
          git push origin main || true
