name: Auto Update Profile README

on:
  schedule:
    - cron: "0 2 * * *"     # Runs daily at 2:00 AM UTC
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Last Updated Date
        run: |
          TODAY=$(date '+%d %B %Y')
          sed -i -E "s/(<!-- LAST_UPDATED -->).*(<!-- \/LAST_UPDATED -->)/\1Last updated on $TODAY\2/" README.md

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): auto-update daily timestamp [skip ci]" || echo "No changes to commit"
          git push origin main
