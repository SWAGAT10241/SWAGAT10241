name: Auto Update Profile README & Seasonal Weather

on:
  schedule:
    - cron: "0 2 * * *"     # Runs daily at 2:00 AM UTC
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Seasonal Weather Banner
        run: |
          node scripts/update-season.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/seasonal-weather.svg public/seasonal-weather.svg README.md
          git commit -m "chore(profile): auto-sync seasonal weather banner [skip ci]" || echo "No changes to commit"
          git push origin main
